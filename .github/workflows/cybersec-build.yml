# Generated by tests/audit/workflow_definitions.py; review changes to both files.
name: Cyber Sec - Java build and configuration syntax

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: '8 3 * * 6'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select installed JDK
        env:
          AUDIT_JAVA_VERSION: '${{ matrix.java }}'
        run: |
          case "$AUDIT_JAVA_VERSION" in
            17) task_java_home="${JAVA_HOME_17_X64:-}" ;;
            21) task_java_home="${JAVA_HOME_21_X64:-}" ;;
            *) exit 1 ;;
          esac
          test -n "$task_java_home"
          test -x "$task_java_home/bin/javac"
          echo "$task_java_home/bin" >> "$GITHUB_PATH"
      - name: Test the audit tooling
        run: python3 -m unittest discover -s tests/audit -p 'test_*.py'
      - name: Run bounded audit
        run: python3 tests/audit/audit.py build --output tests/results/build
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cybersec-build-jdk-${{ matrix.java }}
          path: tests/results/build/
          if-no-files-found: warn
          retention-days: 7
