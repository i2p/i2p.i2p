// Compatibility for regression testing older branches on JDK 17. This does not
// alter packaged runtime dependencies or edit the branch under test.
gradle.projectsEvaluated {
    rootProject.allprojects { project ->
        project.repositories.clear()
        project.repositories.mavenCentral()
        project.configurations.configureEach {
            resolutionStrategy.force 'junit:junit:4.13.2',
                    'org.mockito:mockito-core:5.20.0'
            // Zinc has its own Scala 2.13 runtime. Upgrade only the project's
            // Scala 2.12 line, leaving the compiler bridge's runtime alone.
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.scala-lang' &&
                    details.requested.name == 'scala-library' &&
                    details.requested.version?.startsWith('2.12.'))
                    details.useVersion '2.12.20'
            }
        }
        project.tasks.withType(Test).configureEach {
            jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
                    '--add-opens', 'java.base/java.util=ALL-UNNAMED',
                    '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
                    '--add-opens', 'java.base/java.text=ALL-UNNAMED'
        }
    }
}
