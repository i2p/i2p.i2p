susimail.host=localhost

susimail.ports.fixed=true
susimail.ports.pop3=7660
susimail.ports.smtp=7659

susimail.sender.fixed=true
susimail.sender.domain=mail.i2p
susimail.sender.name=

susimail.pager.pagesize=30

susimail.view.html.allowed=true
susimail.view.html.preferred=true

susimail.composer.cols=80
susimail.composer.rows=15
susimail.composer.copy.to.sent=true

susimail.pop3.leave.on.server=false
susimail.pop3.check.enable=false
susimail.pop3.check.interval.minutes=180
susimail.pop3.idle.timeout.seconds=240

susimail.debug=false

# Saved mail is encrypted locally using the email password at first online login.
# Optional TOTP, recovery codes, private blocklists and spam controls are in Mail security.
# If the provider password changes, unlock using the previous encryption password,
# then update it in Mail security. Back up the complete encrypted account directory.
# Local limits pause downloads; they do not discard the provider's incoming mail.
# DKIM keys must be acquired over a trusted channel (Base64 X.509/SPKI RSA >= 2048 bits).
# No DNS lookup is performed. Require is opt-in and applies to received mail only.
#susimail.dkim.key.selector._domainkey.example.test=BASE64_PUBLIC_KEY
#susimail.dkim.require.example.test=true
